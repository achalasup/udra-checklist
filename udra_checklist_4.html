<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDRA เช็คลิสต์สมาชิก</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');

  :root {
    --primary: #1a3a6b;
    --secondary: #2563a8;
    --accent: #f59e0b;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #cbd5e1;
    --success: #16a34a;
    --check1: #dbeafe;
    --check2: #dcfce7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    color: white;
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }

  header h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  header p {
    font-size: 12px;
    opacity: 0.8;
    margin-top: 2px;
  }

  .stats-bar {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .stat {
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 600;
  }

  .stat span { color: var(--accent); }

  .toolbar {
    padding: 12px 16px;
    background: white;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .search-box {
    flex: 1;
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box:focus { border-color: var(--secondary); }

  .filter-btn {
    padding: 8px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: white;
    font-family: 'Sarabun', sans-serif;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .filter-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  .sync-bar {
    background: #fef3c7;
    border-bottom: 1px solid #fde68a;
    padding: 8px 16px;
    font-size: 12px;
    color: #92400e;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sync-bar.synced {
    background: #dcfce7;
    border-color: #bbf7d0;
    color: #166534;
  }

  .sync-bar.error {
    background: #fee2e2;
    border-color: #fecaca;
    color: #991b1b;
  }

  .list { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }

  .member-card {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
    transition: box-shadow 0.2s;
  }

  .member-card:active { box-shadow: 0 2px 8px rgba(0,0,0,0.12); }

  .member-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }

  .member-no {
    min-width: 28px;
    height: 28px;
    background: var(--primary);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .member-info { flex: 1; }

  .member-shop {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .member-name {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .checks {
    display: flex;
    gap: 8px;
  }

  .check-item {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .check-item.checked-1 {
    background: var(--check1);
    border-color: #93c5fd;
  }

  .check-item.checked-2 {
    background: var(--check2);
    border-color: #86efac;
  }

  .check-box {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 13px;
    transition: all 0.15s;
  }

  .checked-1 .check-box {
    background: #2563eb;
    border-color: #2563eb;
    color: white;
  }

  .checked-2 .check-box {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }

  .check-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .checked-1 .check-label { color: #1d4ed8; }
  .checked-2 .check-label { color: var(--success); }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  .saving-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f59e0b;
    display: inline-block;
    animation: pulse 1s infinite;
  }

  .saved-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #16a34a;
    display: inline-block;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .config-panel {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }

  .config-panel label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }

  .config-input {
    width: 100%;
    padding: 8px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'Sarabun', sans-serif;
    font-size: 12px;
    outline: none;
  }

  .config-input:focus { border-color: var(--secondary); }

  .save-config-btn {
    margin-top: 8px;
    padding: 8px 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'Sarabun', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }

  .toggle-config {
    background: none;
    border: none;
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    cursor: pointer;
    font-family: 'Sarabun', sans-serif;
    padding: 0;
    margin-top: 4px;
    text-decoration: underline;
  }
</style>
</head>
<body>

<header>
  <h1>🍽️ UDRA เช็คลิสต์สมาชิก</h1>
  <p>สมาคมร้านอาหารจังหวัดอุดรธานี</p>
  <div class="stats-bar">
    <div class="stat">ทั้งหมด <span id="total-count">154</span></div>
    <div class="stat">กรอกใบสมัคร <span id="reg-count">0</span></div>
    <div class="stat">รับสติ๊กเกอร์ <span id="stk-count">0</span></div>
  </div>
  <button class="toggle-config" onclick="toggleConfig()">⚙️ ตั้งค่า Google Sheets</button>
</header>

<div class="config-panel" id="config-panel" style="display:none">
  <label>Google Apps Script Web App URL</label>
  <input class="config-input" id="script-url" placeholder="https://script.google.com/macros/s/..." />
  <button class="save-config-btn" onclick="saveConfig()">บันทึกการตั้งค่า</button>
</div>

<div class="sync-bar" id="sync-bar">
  <span class="saving-dot"></span> กำลังโหลดข้อมูลจาก Google Sheets...
</div>

<div class="toolbar">
  <input class="search-box" id="search" placeholder="🔍 ค้นหาชื่อร้าน หรือชื่อ..." oninput="renderList()" />
  <button class="filter-btn" id="f-all" onclick="setFilter('all')">ทั้งหมด</button>
  <button class="filter-btn" id="f-pending" onclick="setFilter('pending')">ยังไม่ครบ</button>
</div>

<div class="list" id="list"></div>

let state = {}; // {id: {reg: bool, stk: bool}}
let filter = 'all';
let scriptUrl = localStorage.getItem('udra_script_url') || '';
let saveTimer = null;

function toggleConfig() {
  const p = document.getElementById('config-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
  document.getElementById('script-url').value = scriptUrl;
}

function saveConfig() {
  scriptUrl = document.getElementById('script-url').value.trim();
  localStorage.setItem('udra_script_url', scriptUrl);
  document.getElementById('config-panel').style.display = 'none';
  loadFromSheet();
}

function setSyncBar(status, msg) {
  const bar = document.getElementById('sync-bar');
  bar.className = 'sync-bar' + (status === 'ok' ? ' synced' : status === 'error' ? ' error' : '');
  bar.innerHTML = status === 'saving'
    ? `<span class="saving-dot"></span> ${msg}`
    : status === 'ok'
    ? `<span class="saved-dot"></span> ${msg}`
    : `⚠️ ${msg}`;
}

async function loadFromSheet() {
  if (!scriptUrl) {
    setSyncBar('error', 'ยังไม่ได้ตั้งค่า URL — กด ⚙️ เพื่อใส่ Google Apps Script URL');
    return;
  }
  setSyncBar('saving', 'กำลังโหลดข้อมูล...');
  try {
    const res = await fetch(scriptUrl + '?action=get&cb=' + Date.now());
    const text = await res.text();
    try { state = JSON.parse(text) || {}; } catch(e) { state = {}; }
    setSyncBar('ok', 'โหลดข้อมูลสำเร็จ · ' + new Date().toLocaleTimeString('th-TH'));
    renderList();
    updateStats();
  } catch(e) {
    setSyncBar('error', 'โหลดไม่ได้ — ตรวจสอบ URL หรือการเชื่อมต่อ');
  }
}

async function saveToSheet() {
  if (!scriptUrl) return;
  setSyncBar('saving', 'กำลังบันทึก...');
  try {
    const encoded = encodeURIComponent(JSON.stringify(state));
    const res = await fetch(scriptUrl + '?action=set&data=' + encoded, {mode: 'no-cors'});
    setSyncBar('ok', 'บันทึกแล้ว · ' + new Date().toLocaleTimeString('th-TH'));
  } catch(e) {
    setSyncBar('error', 'บันทึกไม่ได้ — ตรวจสอบการเชื่อมต่อ');
  }
}

function toggle(id, field) {
  if (!state[id]) state[id] = {reg: false, stk: false};
  state[id][field] = !state[id][field];
  renderList();
  updateStats();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToSheet, 800);
}

function setFilter(f) {
  filter = f;
  document.getElementById('f-all').classList.toggle('active', f === 'all');
  document.getElementById('f-pending').classList.toggle('active', f === 'pending');
  renderList();
}

function updateStats() {
  let reg = 0, stk = 0;
  MEMBERS.forEach(m => {
    if (state[m.id]?.reg) reg++;
    if (state[m.id]?.stk) stk++;
  });
  document.getElementById('reg-count').textContent = reg;
  document.getElementById('stk-count').textContent = stk;
  document.getElementById('total-count').textContent = MEMBERS.length;
}

function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('list');
  let items = MEMBERS.filter(m => {
    const match = !q || m.shop.toLowerCase().includes(q) || m.name.toLowerCase().includes(q);
    if (!match) return false;
    if (filter === 'pending') {
      return !(state[m.id]?.reg && state[m.id]?.stk);
    }
    return true;
  });

  if (items.length === 0) {
    list.innerHTML = '<div class="empty">ไม่พบรายชื่อที่ค้นหา</div>';
    return;
  }

  list.innerHTML = items.map(m => {
    const s = state[m.id] || {};
    return `<div class="member-card">
      <div class="member-top">
        <div class="member-no">${m.id}</div>
        <div class="member-info">
          <div class="member-shop">${m.shop}</div>
          <div class="member-name">${m.name}</div>
        </div>
      </div>
      <div class="checks">
        <div class="check-item ${s.reg ? 'checked-1' : ''}" onclick="toggle(${m.id},'reg')">
          <div class="check-box">${s.reg ? '✓' : ''}</div>
          <span class="check-label">กรอกใบสมัคร</span>
        </div>
        <div class="check-item ${s.stk ? 'checked-2' : ''}" onclick="toggle(${m.id},'stk')">
          <div class="check-box">${s.stk ? '✓' : ''}</div>
          <span class="check-label">รับสติ๊กเกอร์</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Init
document.getElementById('script-url').value = scriptUrl;
renderList();
updateStats();
loadFromSheet();
</script>
